# Publishes the website to https://atmospherichitman.github.io/docfacts/
#
# ── Why GitHub Actions rather than a branch or a /docs folder ───────────
#
# Pages offers three routes. Serving a branch folder needs no workflow at
# all, but only `/` or `/docs` are allowed, so the site would have to be
# renamed into `docs/` — a confusing name in a repository whose subject is
# documentation. A `gh-pages` branch needs a workflow that pushes to it,
# which means granting `contents: write`.
#
# This route grants no write access to the repository at all. The build job
# runs read-only; only the deploy job gets `pages: write` and `id-token:
# write`, and only for the moment it needs them. It also uploads one named
# directory, so what reaches the internet is a list you can read in this
# file rather than whatever happens to be committed.
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Read-only by default. The deploy job widens this for itself, below.
permissions:
  contents: read

# One deployment at a time, and never cancel one halfway: an interrupted
# deploy can leave the site serving a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check and package the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repository is public and the site is static, so nothing here is
      # secret. This guards against the other failure: a file that does not
      # belong in a published directory ending up in one — a note, a backup,
      # an export, an environment file.
      # The same module the test suite runs, rather than a second statement
      # of the same policy in grep.
      #
      # The previous version of this step was exactly that second statement,
      # and it refused to deploy the day the worked example gained two radio
      # buttons: `grep '<input'` cannot tell a radio from a password field,
      # or see whether either is inside a form. The tests had already been
      # taught the narrower rule, so they passed while the deployment
      # failed — two copies of one policy, drifted apart.
      #
      # check-site.mjs tokenises the markup and reads attributes, so the
      # rules can be about what the page does. It needs no dependencies,
      # which is why this step runs before any install.
      - name: Refuse to deploy anything that is not a static site asset
        run: node scripts/check-site.mjs site

      - uses: actions/configure-pages@v5

      # Only this directory is uploaded. Nothing else in the checkout is
      # packaged, so source, tests and history never reach the artifact.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest

    # Scoped to this job, and these are the minimum Pages accepts:
    # `pages: write` to publish, `id-token: write` for the OIDC token that
    # proves the deployment came from this workflow.
    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
